<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Evidence Integrity OS{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css">
<script>
  (function () {
    const saved = localStorage.getItem('theme');
    const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    const initial = saved || (prefersLight ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', initial);
  })();
</script>
</head>
<body>
<div class="wrap">

  <header>
    <a href="/" class="logo">
      <div class="logo-mark">E</div>
      <div>
        <span>evidence_integrity</span>
        <span style="color: var(--text-dim); font-size: 11px; margin-left: 4px;">v0.0.1</span>
      </div>
    </a>
    <nav>
      <a href="/verify">Verificar</a>
      <a href="/docs">Docs</a>
      <a href="https://github.com/Marcorojas17/evidence-integrity-os-">GitHub</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>EVIDENCE_INTEGRITY_OS · 2026 · MIT (código) + CC-BY-4.0 (documentación)</p>
    <p style="margin-top: 6px;">
      Esta plataforma no sustituye a abogado, perito, notario ni PSC.
    </p>
  </footer>

</div>

<script>
  const toggle = document.getElementById('themeToggle');
  if (toggle) {
    toggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  }
</script>

{% block scripts %}{% endblock %}
</body>
</html>
