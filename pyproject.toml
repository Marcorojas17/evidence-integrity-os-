[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-integrity-os"
version = "0.0.1"
description = "Plataforma de integridad y trazabilidad de evidencia digital para Mexico y Latinoamerica"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Marco Antonio Rojas Valdovinos" }
]
keywords = [
  "evidence",
  "integrity",
  "timestamp",
  "rfc3161",
  "jws",
  "pades",
  "forensics",
  "mexico",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]

dependencies = [
  # HTTP / API
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "httpx>=0.27,<1.0",

  # Base de datos
  "psycopg[binary,pool]>=3.2,<4.0",
  "alembic>=1.13,<2.0",

  # Cola
  "redis>=5.0,<6.0",

  # Criptografia
  "cryptography>=42.0,<44.0",
  "asn1crypto>=1.5,<2.0",
  "rfc3161ng>=2.1,<3.0",
  "blake3>=0.4,<1.0",

  # JCS RFC 8785
  "rfc8785>=0.1.4,<1.0",

  # Validacion JSON Schema
  "jsonschema>=4.22,<5.0",

  # PDF y firma PAdES
  "reportlab>=4.1,<5.0",
  "pyhanko>=0.24,<1.0",
  "pyhanko-certvalidator>=0.26,<1.0",

  # QR
  "qrcode[pil]>=7.4,<8.0",

  # Pagos
  "mercadopago>=2.1,<3.0",

  # Utilidades
  "python-dateutil>=2.9,<3.0",
  "tenacity>=8.3,<9.0",
  "structlog>=24.1,<25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-mock>=3.14,<4.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0",
  "bandit[toml]>=1.7,<2.0",
  "pip-audit>=2.7,<3.0",
  "safety>=3.1,<4.0",
  "types-requests>=2.32,<3.0",
]

[project.urls]
Homepage = "https://github.com/Marcorojas17/evidence-integrity-os-"
Repository = "https://github.com/Marcorojas17/evidence-integrity-os-"
Issues = "https://github.com/Marcorojas17/evidence-integrity-os-/issues"

[project.scripts]
evidence-verify = "src.cli.verify_independently:main"

# ---------------------------------------------------------------------------
# Configuracion de herramientas
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "UP",    # pyupgrade
  "S",     # flake8-bandit
  "T20",   # flake8-print
  "SIM",   # flake8-simplify
  "RUF",   # ruff-specific
]
ignore = [
  "S101",   # asserts en tests
  "E501",   # line length (lo maneja ruff con line-length)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "mercadopago.*",
  "rfc3161ng.*",
  "pyhanko.*",
  "blake3.*",
  "rfc8785.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=src",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-fail-under=70",
]
markers = [
  "unit: pruebas unitarias",
  "integration: pruebas de integracion",
  "security: pruebas de seguridad",
  "slow: pruebas lentas",
  "payments: pruebas de procesador de pagos",
]

[tool.coverage.run]
source = ["src"]
omit = [
  "*/tests/*",
  "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101"]
  # Cloud providers
  "boto3>=1.34,<2.0",
  "azure-identity>=1.17,<2.0",
  "azure-keyvault-keys>=4.9,<5.0",
