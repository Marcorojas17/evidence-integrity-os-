version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: evidence_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evidence
      POSTGRES_PASSWORD: evidence_dev_only
      POSTGRES_DB: evidence_dev
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - evidence_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence -d evidence_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evidence_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - evidence_redis:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  evidence_pgdata:
  evidence_redis:
